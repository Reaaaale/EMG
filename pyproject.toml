[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-emg"
version = "0.1.0"
description = "PySide6 acquisition GUI for ADS1299 EEG/EMG boards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "pyqtgraph>=0.13",
  "pyserial>=3.5",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.scripts]
eeg-emg = "eeg_emg.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeg_emg = ["resources/*.qss"]


[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

analysis = ["pandas>=2", "matplotlib>=3.5.2,<4"]
inference = ["torch>=2.3.1,<2.4", "h5py>=3.7,<4", "lava-dl==0.6.0"]
notebooks = ["eeg-emg[analysis]", "ipykernel>=6", "jupyterlab>=4"]
training = ["eeg-emg[inference,notebooks]", "scikit-learn>=1.5,<2"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
